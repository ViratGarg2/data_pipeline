# @package _global_

paths:
  # Set to your data, tokenized with GPT-2 tokenizer!
  train_bin: /ssd_scratch/virat/train.bin
  
  # The validation set which we have already tokenized with GPT-2 tokenizer, don't change this!
  valid_bin: /ssd_scratch/virat/paloma_c4_100_val.bin
  
  model_output: /ssd_scratch/virat/model_checkpoints

training:
  wandb_entity: gargvirat5-iiit-hyderabad  # Set to your wandb entity, e.g. pliang
  wandb_project: cs336-data
  # W&B credentials come from `wandb login` (~/.netrc) or WANDB_API_KEY, never from this file.
  dtype: float16  # RTX 2080 does not support bfloat16
  save_checkpoints: True